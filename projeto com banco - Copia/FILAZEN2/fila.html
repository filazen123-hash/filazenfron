
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila Zen - Acompanhamento</title>
    <link rel="stylesheet" href="/fila.css">
    <script src="../assets/JS/fila.js" defer></script>
</head>

<body>

    <header class="topo">
        <img src="img/logo.jpg.jpeg" class="logo" alt="Logotipo Fila Zen">
        <h2>SUA FILA ONLINE</h2>
        <span class="menu" id="btn-menu">⋮</span>
    </header>

    <main class="card">

        <section class="senha">

            <h1>SENHA ATUAL EM ATENDIMENTO:</h1>
            <div class="senha-atual">
                <span id="senhaMomento">---</span>
            </div>

            <div class="divisao"></div>

            <h1>SUA SENHA:</h1>
            <div class="sua-senha">
                <span id="senhaUsuario">---</span>
            </div>

        </section>

        <section class="informacoes">

            <div class="tempo">
                <h1>TEMPO<br>ESTIMADO:</h1>
                <p><span id="tempoEstimado">00:00h</span></p>
            </div>

            <div class="linha-interna"></div>

            <div class="ultima">
                <h1>ÚLTIMAS SENHAS<br>CHAMADAS:</h1>
                <div id="ultimasSenhasContainer">
                    <p><span>---</span></p>
                </div>
            </div>

        </section>

        <div style="text-align: center; margin-top: 20px;">
            <button onclick="cancelarFila()" id="btnCancelarFila" style="background-color: #d9534f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                CANCELAR MINHA FILA
            </button>
        </div>

    </main>

</body>
</html>

</html>
