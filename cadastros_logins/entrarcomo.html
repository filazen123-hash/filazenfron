<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaZen - Entrar Como</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #f3f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topo / Header igual ao cadastrocomo.html */
        .header-bar {
            width: 100%;
            background-color: #ffffff;
            padding: 16px 40px;
            border-bottom: 1px solid #eef0f4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            display: flex;
            gap: 4px;
        }

        .user-dot {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .user-dot .head {
            width: 9px;
            height: 9px;
            background-color: #ff6b1a;
            border-radius: 50%;
            margin-bottom: 2px;
        }

        .user-dot .body {
            width: 15px;
            height: 11px;
            background-color: #ff6b1a;
            border-radius: 6px 6px 0 0;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo-text .title {
            font-size: 20px;
            font-weight: 800;
            color: #0d0e11;
            letter-spacing: 1px;
        }

        .logo-text .subtitle {
            font-size: 11px;
            font-weight: 700;
            color: #0d0e11;
            letter-spacing: 5px;
            margin-top: 2px;
        }

        /* Área Central */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Card Laranja idêntico ao cadastrarcomo */
        .card-container {
            width: 90%;
            max-width: 920px;
            background: linear-gradient(135deg, #ff5e28 0%, #ff7e33 100%);
            border-radius: 28px;
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .title {
            color: #000000;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 45px;
            text-transform: uppercase;
            text-align: center;
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 480px;
        }

        .btn-option {
            display: block;
            width: 100%;
            background-color: #edf2f7;
            color: #000000;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .btn-option:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .btn-option:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="logo">
            <div class="logo-icon">
                <div class="user-dot"><div class="head"></div><div class="body"></div></div>
                <div class="user-dot"><div class="head"></div><div class="body"></div></div>
            </div>
            <div class="logo-text">
                <span class="title">FILA</span>
                <span class="subtitle">ZEN</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="card-container">
            <h1 class="title">ENTRAR COMO:</h1>

            <div class="buttons-group">
                <a href="logincliente.html" class="btn-option">Usuário/Cliente</a>
                <a href="loginadm.html" class="btn-option">Funcionário</a>
                <a href="/index.html" class="btr-option">Voltar</a>
            </div>
        </div>
    </main>

</body>
</html>
