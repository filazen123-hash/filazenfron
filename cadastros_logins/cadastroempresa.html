<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajustado o 'name' para viewport padrão -->
    <link rel="stylesheet" href="../assets/css/cadastros_logins/estilizacaocadastros.css">
    <script src="../assets/JS/cadastroempresa.js" defer></script>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <title>tela-cadastro-adm</title>
</head>
<body>
    <header>
        <div class="cabeçalho">
            <div class="logotipo">
                <img src="../assets/img/lotipo.png" alt="Logotipo da marca FilaZen">
            </div>
            <h3>C A D A S T R O - E M P R E S A </h3>

            <details>
                <summary><strong>Opções</strong></summary>
                <ul>
                    <li><a href="../index.html" target="_blank">Tela inicial</a></li>
                </ul>
            </details>
        </div>
    </header>
    <main>
        <div class="card-fundo">
            <section class="cadastros">
                <div class="nomecss">
                    <!-- CORREÇÃO: O 'for' agora aponta exatamente para o 'id' do input -->
                    <label for="nomeempresa">NOME EMPRESA: </label>
                    <input type="text" id="nomeempresa" name="nomeempresa" placeholder="Digite o nome da empresa">
                </div>
                <div class="nomecss">
                    <!-- CORREÇÃO: O 'for' agora aponta exatamente para o 'id' do input -->
                    <label for="cnpj">CNPJ:</label>
                    <input type="text" name="cnpj" id="cnpj" placeholder="Digite o CNPJ da empresa">
                </div>
                <div class="tipo">
                    <span class="titulo-tipo">Tipo:</span>
                    
                    <!-- CORREÇÃO: Ajustado os 'for' para os respectivos IDs dos inputs do tipo radio -->
                    <label for="orgao_publico">Órgão Público: </label>
                    <input type="radio" name="tipoempresa" id="orgao_publico" value="Orgao_Publico">
                    
                    <label for="Hospital">Hospital: </label>
                    <input type="radio" name="tipoempresa" id="Hospital" value="Hospital">  
                    
                    <label for="Banco">Banco: </label>
                    <input type="radio" name="tipoempresa" id="Banco" value="Banco">  
                </div>
                <div class="nomecss">
                    <!-- CORREÇÃO: O 'for' agora aponta exatamente para o 'id' do input -->
                    <label for="senhaempresa">CRIE UMA SENHA:</label>
                    <input type="password" name="senha" id="senhaempresa" maxlength="8" placeholder="Crie sua senha até 8 caracteres">
                </div>
                <button id="btnContinuar" onclick="ircadunidade()">CONTINUAR</button>
            </section> 
        </div>
    </main>
    <script>
        $('#cnpj').mask('00.000.000/0000-00', {reverse: true});
    </script>
</body>
</html>
