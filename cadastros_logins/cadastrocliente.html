<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="cadastro-adm" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/cadastros_logins/estilizacaocadastros.css">
    <script src="/assets/JS/cadastrocliente.js " defer></script>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <title>tela-cadastro-usuário</title>
</head>
<body>
    <header>
        <div class="cabeçalho">
            <div class="logotipo">
                <img src="../assets/img/lotipo.png" alt="Logotipo da marca FilaZen">
            </div>
            <h3>C A D A S T R O - U S U Á R I O </h3>

            <details>
                <summary ><strong></strong></summary>
                <ul>
                    <li><a href="../index.html" target="_blank" >Tela inicial</a></li>
                </ul>
            </details>
        </div>
    </header>
    <main>
        <div class="card-fundo">
            <section class="cadastros">
                <div class="nomecss">
                    <label for="name">NOME COMPLETO: </label>
                    <input type="text" id="name" name="name" placeholder="Digite seu nome ">
                </div>
                <div class="nomecss">
                    <label for="nascimento">DATA DE NASCIMENTO:</label>
                    <input type="date" id="nascimento" name="nascimento">
                </div>
                <div class="nomecss">
                    <label for="cpf">CPF:</label>
                    <input type="text" name="cpf" id="cpf" placeholder="Digite o seu cpf">
                </div>
                <div class="nomecss">
                     <label for="email">EMAIL:</label>
                    <input type="email" name="email" id="email" placeholder="Digite um email para contato">
                </div>
                <div class="genero">
                    <label for="masculino">Masculino</label>
                    <input type="radio" value="masculino" name="genero" id="masculino">
                    <label for="feminino">Feminino</label> 
                    <input type="radio" value="feminino" name="genero" id="feminino">  
                </div>
                <div class="prioridade">
                    <label for="prioridade">se identifica como grupo prioritário?</label>
                    <input type="radio" name="prioridades" id="naoprioridade" value="nao">
                    <label for="naoprioridade">Não</label>
                    <input type="radio" name="prioridades" id="prioridade" value="sim">  
                    <label for="prioridade">Sim</label>
                </div>
                <div class="nomecss">
                    <label for="senha">CRIE UMA SENHA:</label>
                    <input type="password" name="senha" id="senha" maxlength="8" placeholder="Crie sua senha com 8 caracteres">
                </div>
                <button id="btnContinuar" onclick="cadastrado()">CONTINUAR</button>

            </section>
        </div>
    </main>
    <script>
         $('#cpf').mask('000.000.000-00', {reverse: true});
    </script>
</body>
</html>
