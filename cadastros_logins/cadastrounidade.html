<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="cadastro-adm" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/cadastros_logins/estilizacaocadastros.css">
    <script src="../assets/JS/cadastrounidade.js" defer></script>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <title>tela-cadastro-adm</title>
</head>
<body>
    <header>
        <div class="cabeçalho">
            <div class="logotipo">
                <img src="../assets/img/lotipo.png" alt="Logotipo da marca FilaZen">
            </div>
            <h3>C A D A S T R O - U N I D A D E </h3>

            <details>
                <summary ><strong></strong></summary>
                <ul>
                    <li><a href="../index.html" target="_blank" >Tela inicial</a></li>
                </ul>
            </details>
        </div>
    </header>
    <main>
        <div class="card-fundo">
            <section class="cadastros">
                <div class="nomecss">
                    <label for="name">NOME SOCIAL UNIDADE: </label>
                    <input type="text" id="nomeunidade" name="name" placeholder="Digite o nome social da unidade ">
                </div>
                <div class="nomecss">
                    <label for="cnpj">CNPJ Responsável:</label>
                    <input type="text" name="empresa" id="nomeempresa"  placeholder="Digite o CNPJ da empresa dessa unidade">
                </div>
                <div class="nomecss">
                    <label for="endereco">Endereço</label>
                    <input type="text" name="endereco" id="endereco" placeholder="Digite o endereco da unidade">
                </div>
                  <div class="nomecss">
                    <label for="CEP">CEP</label>
                    <input type="text" name="cep" id="cep"  placeholder="Digite o cep da unidade">
                </div>
                <div class="nomecss">
                    <label for="longitude">Longitude</label>
                    <input type="text" name="longitude" id="longitude" placeholder="Digite a longitude para aparecer no mapa">
                </div>
                <div class="nomecss">
                    <label for="Latitude">Latitude</label>
                    <input type="text" name="latitude" id="latitude" placeholder="Digite a latitude para aparecer no mapa">
                </div>
                
                <button id="btnContinuar" onclick="cadastrarfuncionario()">CONTINUAR</button>
            </section>
        </div>
    </main>
    <script>
        $('#cep').mask('00000-000');
        $('#nomeempresa').mask('00.000.000/0000-00', {reverse: true});
    </script>
</body>
</html>
