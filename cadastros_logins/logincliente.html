<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - Fila Zen</title>
  <link rel="stylesheet" href="../assets/css/cadastros_logins/logincliente.css">
  <script src="../assets/JS/logincliente.js " defer></script>
</head>
<body>
  
  <table width="100%" class="header-table">
    <tr>
      <td align="left">
        <div class="logo-tipo">
            <img src="../assets/img/lotipo.png" alt="Logotipo do filazen">
        </div>
      </td>
      <td align="center">
        <font size="3"><b>L O G I N</b></font>
      </td>
      <td align="right">
         <details>
                <summary ><strong></strong></summary>
                <ul>
                    <li><a href="../index.html" target="_blank" >Tela inicial</a></li>
                </ul>
            </details>
        &nbsp;
      </td>
    </tr>
  </table>

  <div class="login-card">
    <center>
      <table>
        <tr>
          <td align="right">
            <font size="5"><b>E-mail:</b></font>
          </td>
          <td>
            <input type="email" name="email" size="90" id="email">
          </td>
        </tr>

        <tr>
          <td colspan="2"><br></td>
        </tr>

        <tr>
          <td align="right">
            <font size="5"><b>Senha:</b></font>
          </td>
          <td>
            <input type="password" name="senha" size="90" id="senha" maxlength="8">
          </td>
        </tr>
      </table>

      <br><br>

      
    </center>
  </div>
    <div class="botoes">
      <button type="submit" id="btnContinuar" onclick="irescolha()">Continuar</button>
      <button id="btnvoltar" onclick="voltar()">VOLTAR</button>
    </div>
  <div class="below-card-circle-wrap">
    <div class="below-card-circle"></div>
  </div>

  <div class="bottom-triangle"></div>

</body>
</html>
